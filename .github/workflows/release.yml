name: release

on:
  push:
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 -m unittest discover -s tests -v

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: sudo apt-get update -q && sudo apt-get install -y -q build-essential debhelper dh-python devscripts python3-setuptools
      - name: Python sdist/wheel
        run: pip install build && python3 -m build
      - name: Debian package
        run: dpkg-buildpackage -us -uc -b && mv ../tilawah_*.deb .
      - name: APT metadata
        run: |
          mkdir -p apt-repo && cp tilawah_*.deb apt-repo/
          (cd apt-repo && dpkg-scanpackages --multiversion . /dev/null | gzip -9c > Packages.gz)
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: "dist/*" }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            tilawah_*.deb
            apt-repo/Packages.gz
