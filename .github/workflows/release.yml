name: release

on:
  push:
    tags: ["v*"]

# One release run per tag: duplicate/overlapping runs cancel instead of
# racing each other on `gh release create` (second creator gets HTTP 422).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false  # one OS red must never hide the other two results
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: Install test deps (ffmpeg + pip packages)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          pip install -q yt-dlp
      - name: Install test deps (pip packages)
        if: runner.os != 'Linux'
        run: pip install -q yt-dlp
      - run: python3 -m unittest discover -s tests -v

  build:
    needs: test
    runs-on: ubuntu-latest
    # Per https://docs.github.com/en/rest/releases/releases: the token creating
    # the release needs contents:write.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Validate workflow YAML (strict, duplicate keys fail)
        run: |
          pip install -q pyyaml
          python3 - <<'EOF'
          import yaml
          class Strict(yaml.SafeLoader): pass
          def nodup(loader, node, deep=False):
              mapping = {}
              for k, v in node.value:
                  key = loader.construct_object(k, deep=True)
                  if key in mapping:
                      raise ValueError(f"duplicate key: {key}")
                  mapping[key] = loader.construct_object(v, deep=True)
              return mapping
          Strict.add_constructor(
              yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG, nodup)
          yaml.load(open('.github/workflows/release.yml'), Loader=Strict)
          print('workflow YAML OK')
          EOF
      - name: Version consistency (tag == code == changelog)
        run: |
          TAG="${{ github.ref_name }}"
          CODE="$(python3 -c 'import tilawah; print(tilawah.__version__)')"
          [ "$TAG" = "v$CODE" ] || { echo "tag $TAG != code v$CODE"; exit 1; }
          head -1 debian/changelog | grep -q "($CODE-1)" || { echo "changelog top != $CODE-1"; exit 1; }
          echo "version OK: $TAG"
      - name: Install build deps
        run: sudo apt-get update -q && sudo apt-get install -y -q build-essential debhelper dh-python pybuild-plugin-pyproject devscripts python3-setuptools
      - name: Python sdist/wheel
        run: pip install build && python3 -m build
      - name: Debian package
        run: dpkg-buildpackage -us -uc -b && mv ../tilawah_*.deb .
      - name: APT metadata
        run: |
          mkdir -p apt-repo && cp tilawah_*.deb apt-repo/
          (cd apt-repo && dpkg-scanpackages --multiversion . /dev/null | gzip -9c > Packages.gz)
      # gh CLI is preinstalled on runners: no third-party Node action needed.
      # (No upload-artifact step: the release itself is the permanent artifact.)
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          Terminal-native Qur'an audio player: stream 114 surahs, save offline
          audio, personal YouTube shelf, sleep timer, TUI with ambient visuals.

          Install: `sudo apt install ./tilawah_*_all.deb`
          (then `sudo apt install mpv yt-dlp ffmpeg` for audio + YouTube),
          or `pip install` the attached wheel. Full guide in README.md.
          EOF
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "release already exists - uploading assets only"
          else
            gh release create "${{ github.ref_name }}" \
              --title "Tilawah ${{ github.ref_name }}" \
              --notes-file release-notes.md --latest
          fi
          gh release upload "${{ github.ref_name }}" \
            dist/* tilawah_*.deb apt-repo/Packages.gz --clobber

  apt-pages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - name: Install deploy deps
        run: sudo apt-get update -q && sudo apt-get install -y -q dpkg-dev gzip git
      # Pure git + dpkg tools: publishes apt-repo/ to the gh-pages branch so
      # `sudo apt install tilawah` works straight from GitHub Pages.
      - name: Publish APT repo to GitHub Pages
        run: |
          set -eu
          sh packaging/publish-apt.sh
          mkdir -p /tmp/aptpub
          cp apt-repo/tilawah_*.deb apt-repo/Packages apt-repo/Packages.gz \
             apt-repo/Release /tmp/aptpub/
          cp packaging/install.sh /tmp/aptpub/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages-pub
          git rm -rf --cached . >/dev/null 2>&1 || true
          git clean -fdx >/dev/null
          cp /tmp/aptpub/* .
          cat > README.md <<'EOF'
          # Tilawah APT repository
          served via GitHub Pages from this branch.

          ```bash
          echo "deb [trusted=yes] https://alkokandiy.github.io/tilawah/ ./" \
            | sudo tee /etc/apt/sources.list.d/tilawah.list
          sudo apt update && sudo apt install tilawah
          ```
          EOF
          git add -A
          git commit -qm "APT repo for ${{ github.ref_name }}"
          git push --force origin gh-pages-pub:gh-pages
