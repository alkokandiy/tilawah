[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tilawah"
version = "1.0.6"
description = "Terminal-native Qur'an audio player (mp3quran.net streaming + offline + YouTube shelf)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []
optional-dependencies = { art = ["Pillow>=9"] }

[project.scripts]
tilawah = "tilawah.cli:main"

[project.urls]
Homepage = "https://example.invalid/tilawah"

[tool.setuptools.packages.find]
include = ["tilawah*"]
